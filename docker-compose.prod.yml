

version: '3.8'

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    restart: always
    logging: *logging

  postgres:
    restart: always
    logging: *logging

  service-user:
    restart: always
    logging: *logging

  service-transaction:
    restart: always
    logging: *logging

  service-budget:
    restart: always
    logging: *logging

  service-billing:
    restart: always
    logging: *logging

  service-analytics:
    restart: always
    logging: *logging

  service-notification:
    restart: always
    logging: *logging

  frontend:
    restart: always
    logging: *logging

  api-gateway:
    restart: always
    logging: *logging
